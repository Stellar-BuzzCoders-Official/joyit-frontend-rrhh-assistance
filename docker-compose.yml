services:
  rrhh-frontend-assistance:
    container_name: rrhh-frontend-assistance
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4200:4200"
    volumes:
      - ./src:/app/src
      - ./angular.json:/app/angular.json
      - ./tsconfig.json:/app/tsconfig.json
      - ./package.json:/app/package.json
      - ./public:/app/public
      - ./src/environments:/app/src/environments
    networks:
      - rrhh_screening_net

networks:
  rrhh_screening_net:
    external: true
