<div class="flex h-screen p-4 overflow-hidden relative" style="background-color: #eef3ff;">
  <!-- Contenedor del Sidebar con Lengüeta Retráctil que sobresale -->
  <div
    class="relative h-full shrink-0 flex items-start transition-all duration-300 ease-in-out"
    [ngClass]="isSidebarOpen ? 'w-80 mr-3' : 'w-0 mr-4'"
  >
    <!-- Panel Sidebar -->
    <div
      class="h-full w-80 overflow-hidden shadow-sm flex flex-col transition-all duration-300 ease-in-out rounded-3xl"
      [ngClass]="isSidebarOpen ? 'opacity-100' : 'opacity-0 -translate-x-full pointer-events-none'"
    >
      <app-sidebar
        #sidebar
        class="w-full h-full flex flex-col min-h-0 overflow-hidden"
        (chatSelected)="onChatSelected($event)"
        (newChat)="onNewChat()"
      ></app-sidebar>
    </div>

    <!-- Lengüeta que sobresale siempre (abierto o cerrado) -->
    <button
      type="button"
      (click)="toggleSidebar()"
      class="absolute top-10 -right-3.5 z-30 w-7 h-12 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 shadow-md rounded-r-xl flex items-center justify-center text-gray-500 hover:text-blue-600 dark:text-gray-300 dark:hover:text-blue-400 transition-all duration-200 hover:w-8 cursor-pointer focus:outline-none"
      [title]="isSidebarOpen ? 'Ocultar panel de chats' : 'Mostrar panel de chats'"
    >
      <svg
        class="w-4 h-4 transition-transform duration-300"
        [ngClass]="{'rotate-180': !isSidebarOpen}"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/>
      </svg>
    </button>
  </div>

  <!-- Chat principal -->
  <app-chat
    #chat
    class="flex-1 h-full flex flex-col min-h-0 overflow-hidden transition-all duration-300"
    [selectedChat]="currentChat"
    (threadUpdated)="sidebar.loadChatHistory()"
  ></app-chat>
</div>
