<div class="flex h-screen p-4 overflow-hidden" style="background-color: #eef3ff;">
  <!-- Sidebar -->
  <div class="w-80 bg-white rounded-3xl h-full overflow-hidden shadow-sm flex flex-col shrink-0">
    <app-sidebar
      #sidebar
      class="w-full h-full flex flex-col min-h-0 overflow-hidden"
      (chatSelected)="onChatSelected($event)"
      (newChat)="onNewChat()"
    ></app-sidebar>
  </div>

  <!-- Chat principal -->
  <app-chat
    #chat
    class="flex-1 ml-4 h-full flex flex-col min-h-0 overflow-hidden"
    [selectedChat]="currentChat"
    (threadUpdated)="sidebar.loadChatHistory()"
  ></app-chat>
</div>
