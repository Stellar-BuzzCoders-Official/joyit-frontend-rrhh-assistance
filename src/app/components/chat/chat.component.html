<div class="flex flex-col h-full max-w-6xl mx-auto rounded-2xl bg-transparent  ">
  <!-- Mensajes -->
  <div class="flex-1 overflow-y-auto p-6 space-y-4">
    <div
      *ngFor="let msg of messages"
      class="flex"
      [ngClass]="msg.from === 'Tú' ? 'justify-end' : 'justify-start'"
    >
      <div
        class="max-w-[70%] px-4 py-3 rounded-2xl text-sm leading-relaxed shadow-md"
        [ngClass]="msg.from === 'Tú' ? 'bg-blue-600 text-white rounded-br-sm' : 'bg-gray-100 text-gray-800 rounded-bl-sm'">
        <span class="block font-semibold mb-1">{{ msg.from }}:</span>
        <span>{{ msg.text }}</span>
      </div>
    </div>
  </div>

  <!-- Input -->
  <form (submit)="sendMessage($event)" class="flex items-center gap-3 px-4 py-3 border-t border-gray-200 bg-gray-50">
    <input
      [(ngModel)]="userInput"
      name="userInput"
      placeholder="Escribe tu mensaje..."
      class="flex-1 px-5 py-2 border border-gray-300 rounded-full focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white"
      required
    />
    <button
      type="submit"
      class="px-5 py-2 bg-blue-600 text-white font-medium rounded-full hover:bg-blue-700 transition duration-200"
    >
      Enviar
    </button>
  </form>
</div>
