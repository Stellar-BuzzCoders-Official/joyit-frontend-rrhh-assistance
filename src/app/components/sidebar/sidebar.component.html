<div class="w-full h-full bg-white dark:bg-gray-900 p-4 flex flex-col rounded-3xl select-none min-h-0 border border-gray-100 dark:border-gray-800">
  <!-- Título -->
  <div class="flex items-center justify-between mb-4 mt-2 shrink-0">
    <h2 class="text-xl font-bold text-gray-800 dark:text-gray-100 flex items-center gap-2">
      <img src="logo.png" alt="" class="h-6 w-auto">
      <span class="truncate">RRHH Assistance</span>
    </h2>
  </div>

  <!-- Botón nuevo chat + lupa -->
  <div class="flex items-center justify-between mb-4 gap-2 shrink-0">
    <button
      (click)="startNewChat()"
      class="bg-[#5a6af9] text-white py-2 px-4 rounded-full hover:bg-blue-700 transition duration-200 flex-1 flex items-center justify-center gap-1.5 font-medium text-sm shadow-sm cursor-pointer"
    >
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/>
      </svg>
      Nuevo Chat
    </button>
    <button
      type="button"
      (click)="toggleSearch()"
      class="w-9 h-9 flex items-center justify-center rounded-full cursor-pointer hover:scale-105 transition"
      [ngClass]="isSearching ? 'bg-blue-600 text-white' : 'bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700'"
      title="Buscar conversación"
    >
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35m0 0A7.5 7.5 0 1010.5 18.5a7.5 7.5 0 006.15-3.85z"/>
      </svg>
    </button>
  </div>

  <!-- Barra de búsqueda rápida si está activa -->
  <div *ngIf="isSearching" class="mb-3 shrink-0">
    <input
      type="text"
      [(ngModel)]="searchQuery"
      placeholder="Filtrar por título..."
      class="w-full px-3 py-1.5 text-xs border border-gray-200 dark:border-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-300 dark:bg-gray-800 dark:text-gray-100"
    />
  </div>

  <!-- Historial Header con paleta acordeón -->
  <div class="flex items-center justify-between mb-2 shrink-0">
    <button
      type="button"
      (click)="toggleHistory()"
      class="flex items-center gap-1.5 text-xs font-semibold text-gray-400 dark:text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 uppercase tracking-wider transition cursor-pointer select-none"
      title="Plegar / desplegar conversaciones"
    >
      <svg
        class="w-3.5 h-3.5 text-gray-400 transition-transform duration-200"
        [ngClass]="{'rotate-180': isHistoryExpanded}"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
      </svg>
      <span>Historial de conversaciones</span>
      <span *ngIf="chatHistory.length > 0" class="text-[10px] font-normal lowercase text-gray-400">({{ chatHistory.length }})</span>
    </button>

    <button
      type="button"
      (click)="loadChatHistory()"
      class="text-gray-400 hover:text-blue-500 text-xs p-1 rounded transition cursor-pointer"
      title="Actualizar historial"
    >
      <svg class="w-3.5 h-3.5" [ngClass]="{'animate-spin': isLoading}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
      </svg>
    </button>
  </div>

  <!-- Lista de conversaciones con acordeón plegable y scroll -->
  <div
    *ngIf="isHistoryExpanded"
    class="flex-1 overflow-y-auto space-y-1 pr-1 min-h-0 transition-all duration-300"
  >
    <div *ngIf="isLoading && chatHistory.length === 0" class="text-xs text-gray-400 p-4 text-center">
      Cargando historial...
    </div>

    <div *ngIf="!isLoading && filteredChatHistory.length === 0" class="text-xs text-gray-400 p-4 text-center">
      {{ searchQuery ? 'No se encontraron conversaciones con ese filtro.' : 'No hay conversaciones previas.' }}
    </div>

    <div
      *ngFor="let chat of filteredChatHistory"
      (click)="selectChat(chat)"
      class="flex items-center justify-between px-3 py-2.5 rounded-xl cursor-pointer transition group"
      [ngClass]="selectedChatId === chat.id ? 'bg-blue-50 dark:bg-blue-950/40 text-blue-700 dark:text-blue-300 font-semibold border border-blue-200 dark:border-blue-800 shadow-xs' : 'hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-700 dark:text-gray-200'"
    >
      <div class="flex items-center gap-2.5 min-w-0 flex-1">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="shrink-0"
          [ngClass]="selectedChatId === chat.id ? 'text-blue-600 dark:text-blue-400' : 'text-gray-400 group-hover:text-gray-600 dark:group-hover:text-gray-300'"
        >
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        <span class="truncate text-sm">
          {{ chat.title }}
        </span>
      </div>

      <!-- Botón de eliminar en hover -->
      <button
        type="button"
        (click)="deleteChat($event, chat.id)"
        class="opacity-0 group-hover:opacity-100 p-1 text-gray-400 hover:text-red-500 rounded transition ml-1 shrink-0"
        title="Eliminar conversación"
      >
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
        </svg>
      </button>
    </div>
  </div>

  <div
    *ngIf="!isHistoryExpanded"
    class="flex-1 flex flex-col items-center justify-center text-xs text-gray-400 italic p-4 select-none"
  >
    <svg class="w-8 h-8 text-gray-300 dark:text-gray-600 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/>
    </svg>
    <span>Historial oculto (haz clic en el título para desplegar)</span>
  </div>

  <!-- Ajustes y perfil -->
  <div class="mt-auto pt-3 border-t border-gray-100 dark:border-gray-800 shrink-0">
    <!-- Ajustes -->
    <div
      routerLink="/settings"
      class="flex items-center gap-3 mb-2 cursor-pointer text-gray-600 dark:text-gray-300 hover:text-blue-600 dark:hover:text-blue-400 transition-colors p-2 rounded-xl hover:bg-gray-50 dark:hover:bg-gray-800 text-sm font-medium"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.591 1.011c1.52-.89 3.304.893 2.413 2.413a1.724 1.724 0 001.011 2.591c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.011 2.591c.89 1.52-.893 3.304-2.413 2.413a1.724 1.724 0 00-2.591 1.011c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.591-1.011c-1.52.89-3.304-.893-2.413-2.413a1.724 1.724 0 00-1.011-2.591c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.011-2.591c-.89-1.52.893-3.304 2.413-2.413a1.724 1.724 0 002.591-1.011z" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
      </svg>
      <span>Ajustes</span>
    </div>

    <!-- Usuario -->
    <div class="flex items-center gap-3 px-2 py-1">
      <div class="w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-xs uppercase shadow-sm shrink-0">
        RR
      </div>
      <div class="flex flex-col min-w-0">
        <span class="text-gray-900 dark:text-gray-100 font-semibold text-xs truncate">Reclutador IA</span>
        <span class="text-gray-400 text-[10px] truncate">admin&#64;rrhh.ai</span>
      </div>
    </div>
  </div>
</div>
